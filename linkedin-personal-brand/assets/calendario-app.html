<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario editorial</title>

<!--
  App de calendario editorial del skill linkedin-personal-brand.
  Un solo archivo, sin dependencias, sin servidor. Se abre con doble clic.

  COMO SE ACTUALIZA: Claude reescribe el bloque <script id="datos"> de abajo
  a partir de calendario.md. No hay que tocar el HTML ni el CSS.
  Ver references/05-calendario-editorial.md.
-->

<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #dfe3e8;
    --text: #14181d;
    --text-dim: #5b6672;
    --text-faint: #8a94a0;
    --accent: #0a66c2;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);

    --cat-reaccion: #d97706;
    --cat-postura: #dc2626;
    --cat-historia: #7c3aed;
    --cat-builder: #059669;
    --cat-comentario: #0891b2;
    --cat-cuarentena: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2129;
      --border: #2a313b;
      --text: #e6edf3;
      --text-dim: #9aa6b2;
      --text-faint: #6e7a87;
      --accent: #58a6ff;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);

      --cat-reaccion: #f59e0b;
      --cat-postura: #f87171;
      --cat-historia: #a78bfa;
      --cat-builder: #34d399;
      --cat-comentario: #22d3ee;
      --cat-cuarentena: #8b96a3;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--text-dim); font-size: 13px; }

  /* ---------- stats ---------- */
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px; min-width: 108px;
  }
  .stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
  .stat.alert b { color: var(--cat-postura); }

  /* ---------- controls ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  button.chip, .seg button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; transition: .12s;
  }
  button.chip:hover, .seg button:hover { color: var(--text); border-color: var(--text-faint); }
  button.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; border-radius: 0; padding: 6px 15px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .spacer { flex: 1; }

  /* ---------- week grid ---------- */
  .weeknav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .weeknav h2 { font-size: 14px; margin: 0; color: var(--text-dim); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .day {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px; min-height: 130px;
  }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .day > h3 {
    font-size: 11px; margin: 0 0 9px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .07em; font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .day > h3 em { font-style: normal; color: var(--text-faint); font-weight: 400; letter-spacing: 0; }
  .day.today > h3 { color: var(--accent); }
  .empty { color: var(--text-faint); font-size: 12px; font-style: italic; padding: 6px 2px; }

  /* ---------- card ---------- */
  .card {
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid var(--cat); border-radius: 7px;
    padding: 9px 10px; margin-bottom: 8px; transition: .12s;
    display: block;
  }
  .card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--cat); }
  .card:last-child { margin-bottom: 0; }
  .card .cat {
    font-size: 10px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--cat); display: block; margin-bottom: 3px;
  }
  .card .tit { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .card .meta {
    font-size: 11px; color: var(--text-dim); margin-top: 6px;
    display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .publicado { background: #16a34a; }
  .listo     { background: #16a34a; }
  .parcial   { background: #eab308; }
  .pendiente { background: #ef4444; }
  .badge {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    background: var(--cat-postura); color: #fff; letter-spacing: .03em;
  }

  /* ---------- list ---------- */
  .list .day { min-height: 0; margin-bottom: 10px; }

  /* ---------- detail ---------- */
  dialog {
    border: 1px solid var(--border); border-radius: 14px; padding: 0;
    background: var(--surface); color: var(--text);
    max-width: 720px; width: calc(100% - 32px); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
  .dhead {
    padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
  }
  .dhead h2 { margin: 4px 0 0; font-size: 18px; line-height: 1.3; }
  .dclose {
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer; flex: none;
    background: none; border: 0; color: var(--text-faint); padding: 2px 6px; border-radius: 6px;
  }
  .dclose:hover { color: var(--text); background: var(--surface-2); }
  .dbody { padding: 18px 22px 24px; max-height: 62vh; overflow-y: auto; }
  .sect { margin-bottom: 20px; }
  .sect:last-child { margin-bottom: 0; }
  .sect > h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-faint); margin: 0 0 8px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .copy {
    font: inherit; font-size: 11px; cursor: pointer; padding: 2px 9px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim); letter-spacing: 0; text-transform: none;
  }
  .copy:hover { color: var(--text); border-color: var(--text-faint); }
  .copy.ok { color: #16a34a; border-color: #16a34a; }
  pre.txt {
    margin: 0; padding: 14px 16px; white-space: pre-wrap; word-wrap: break-word;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: 14px; line-height: 1.6;
  }
  pre.txt.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13px; }
  .kv dt { color: var(--text-dim); }
  .kv dd { margin: 0; }
  .srcs { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  .srcs li { margin-bottom: 4px; word-break: break-all; }
  a { color: var(--accent); }
  .note {
    font-size: 13px; color: var(--text-dim); background: var(--surface-2);
    border-left: 3px solid var(--border); padding: 9px 13px; border-radius: 0 7px 7px 0;
  }
  footer { margin-top: 34px; font-size: 12px; color: var(--text-faint); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="marca">Calendario editorial</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Vista">
      <button id="vSemana" aria-pressed="true">Semana</button>
      <button id="vLista" aria-pressed="false">Todo</button>
    </div>
    <div class="spacer"></div>
    <div id="filtros"></div>
  </div>

  <div class="weeknav" id="weeknav" hidden>
    <button class="chip" id="prev">&larr;</button>
    <button class="chip" id="hoy">Esta semana</button>
    <button class="chip" id="next">&rarr;</button>
    <h2 id="rango"></h2>
  </div>

  <div id="vista"></div>

  <footer>Generado por el skill <b>linkedin-personal-brand</b>. Se actualiza reescribiendo el bloque de datos.</footer>
</div>

<dialog id="detalle">
  <div class="dhead">
    <div>
      <span class="cat" id="dCat"></span>
      <h2 id="dTit"></h2>
    </div>
    <button class="dclose" id="dClose" aria-label="Cerrar">&times;</button>
  </div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script id="datos" type="application/json">
{
  "marca": "Tu nombre",
  "actualizado": "",
  "zonaHoraria": "ART",
  "ritmo": [],
  "posts": []
}
</script>

<script>
(() => {
  "use strict";

  const D = JSON.parse(document.getElementById("datos").textContent);
  const CATS = {
    reaccion:   { label: "Reacción",    color: "var(--cat-reaccion)" },
    postura:    { label: "Postura",     color: "var(--cat-postura)" },
    historia:   { label: "Historia",    color: "var(--cat-historia)" },
    builder:    { label: "Builder",     color: "var(--cat-builder)" },
    comentario: { label: "Comentario",  color: "var(--cat-comentario)" },
    cuarentena: { label: "Cuarentena",  color: "var(--cat-cuarentena)" }
  };
  const ESTADOS = {
    publicado: { label: "Publicado",       cls: "publicado" },
    listo:     { label: "Listo",           cls: "listo" },
    parcial:   { label: "Texto pendiente", cls: "parcial" },
    pendiente: { label: "Tema pendiente",  cls: "pendiente" }
  };
  const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  // Fechas como YYYY-MM-DD, siempre en local, sin sorpresas de zona horaria.
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const key   = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  const monday = dt => { const c = new Date(dt); const wd = (c.getDay()+6)%7; c.setDate(c.getDate()-wd); c.setHours(0,0,0,0); return c; };
  const addDays = (dt,n) => { const c = new Date(dt); c.setDate(c.getDate()+n); return c; };
  const HOY = new Date(); HOY.setHours(0,0,0,0);
  const diasHasta = s => Math.round((parse(s) - HOY) / 86400000);

  let semana = monday(HOY);
  let vista = "semana";
  let filtro = null;

  const visibles = () => D.posts.filter(p => !filtro || p.categoria === filtro);

  // ---------- cabecera ----------
  document.getElementById("marca").textContent = `Calendario editorial · ${D.marca}`;
  document.title = `Calendario · ${D.marca}`;
  document.getElementById("sub").textContent =
    [D.actualizado && `Actualizado ${D.actualizado}`, D.zonaHoraria && `Horarios en ${D.zonaHoraria}`]
      .filter(Boolean).join(" · ");

  function stats() {
    const ps = D.posts.filter(p => p.categoria !== "cuarentena");
    const pend = ps.filter(p => p.estado === "parcial" || p.estado === "pendiente").length;
    const urg = ps.filter(p => p.vence && p.estado !== "publicado" && diasHasta(p.vence) >= 0 && diasHasta(p.vence) <= 30).length;
    const cuar = D.posts.filter(p => p.categoria === "cuarentena").length;
    const items = [
      ["En cola",   ps.filter(p => p.estado !== "publicado").length, false],
      ["Listos",    ps.filter(p => p.estado === "listo").length, false],
      ["Pendientes",pend, pend > 0],
      ["Con fecha límite", urg, urg > 0],
      ["Publicados",ps.filter(p => p.estado === "publicado").length, false],
      ["Cuarentena",cuar, false]
    ];
    document.getElementById("stats").innerHTML = items.map(([l,v,a]) =>
      `<div class="stat${a ? " alert" : ""}"><b>${v}</b><span>${l}</span></div>`).join("");
  }

  function filtros() {
    const usadas = [...new Set(D.posts.map(p => p.categoria))];
    document.getElementById("filtros").innerHTML =
      usadas.map(c => `<button class="chip" data-cat="${c}" aria-pressed="false"
        style="border-color:${CATS[c]?.color}55">${CATS[c]?.label || c}</button>`).join(" ");
    document.querySelectorAll("#filtros .chip").forEach(b => b.onclick = () => {
      filtro = filtro === b.dataset.cat ? null : b.dataset.cat;
      document.querySelectorAll("#filtros .chip").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.cat === filtro)));
      render();
    });
  }

  // ---------- tarjetas ----------
  function card(p, i) {
    const c = CATS[p.categoria] || { label: p.categoria, color: "var(--cat-cuarentena)" };
    const e = ESTADOS[p.estado] || ESTADOS.pendiente;
    const dd = p.vence && p.estado !== "publicado" ? diasHasta(p.vence) : null;
    const urgente = dd !== null && dd >= 0 && dd <= 30;
    return `<button class="card" style="--cat:${c.color}" data-i="${i}">
      <span class="cat">${c.label}</span>
      <span class="tit">${esc(p.titulo)}</span>
      <span class="meta">
        <span class="dot ${e.cls}"></span>${e.label}
        ${p.hora ? ` · ${esc(p.hora)}` : ""}
        ${urgente ? `<span class="badge">${dd === 0 ? "vence hoy" : `${dd}d`}</span>` : ""}
        ${p.prioridad ? `<span class="badge" style="background:var(--accent)">${esc(p.prioridad)}</span>` : ""}
      </span>
    </button>`;
  }
  const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));

  // ---------- vistas ----------
  function render() {
    stats();
    document.getElementById("weeknav").hidden = vista !== "semana";
    document.getElementById("vista").innerHTML = vista === "semana" ? semanaHTML() : listaHTML();
    document.querySelectorAll(".card").forEach(b => b.onclick = () => abrir(+b.dataset.i));
  }

  function semanaHTML() {
    const fin = addDays(semana, 4);
    document.getElementById("rango").textContent =
      `${semana.getDate()} al ${fin.getDate()} de ${MESES[fin.getMonth()]}`;
    return `<div class="grid">` + DIAS.map((nom, n) => {
      const dt = addDays(semana, n), k = key(dt);
      const hoy = k === key(HOY);
      const ritmo = (D.ritmo || []).find(r => r.dia === nom);
      const items = visibles()
        .map((p, i) => ({ p, i }))
        .filter(({p}) => p.fecha === k);
      return `<div class="day${hoy ? " today" : ""}">
        <h3>${nom} ${dt.getDate()}<em>${ritmo ? esc(ritmo.formato) : ""}</em></h3>
        ${items.length ? items.map(({p,i}) => card(p,i)).join("")
                       : `<div class="empty">${ritmo ? esc(ritmo.hora || "") + " libre" : "libre"}</div>`}
      </div>`;
    }).join("") + `</div>`;
  }

  function listaHTML() {
    const ord = visibles().map((p,i) => ({p,i}))
      .sort((a,b) => (a.p.fecha || "9999").localeCompare(b.p.fecha || "9999"));
    const grupos = new Map();
    for (const it of ord) {
      const g = it.p.fecha
        ? `${DIAS[(parse(it.p.fecha).getDay()+6)%7] || ""} ${parse(it.p.fecha).getDate()} de ${MESES[parse(it.p.fecha).getMonth()]}`
        : "Sin fecha asignada";
      if (!grupos.has(g)) grupos.set(g, []);
      grupos.get(g).push(it);
    }
    if (!grupos.size) return `<div class="day"><div class="empty">Nada en cola.</div></div>`;
    return `<div class="list">` + [...grupos].map(([g, its]) =>
      `<div class="day"><h3>${esc(g)}</h3>${its.map(({p,i}) => card(p,i)).join("")}</div>`).join("") + `</div>`;
  }

  // ---------- detalle ----------
  const dlg = document.getElementById("detalle");
  function abrir(i) {
    const p = D.posts[i];
    const c = CATS[p.categoria] || { label: p.categoria, color: "var(--cat-cuarentena)" };
    document.getElementById("dCat").textContent = c.label;
    document.getElementById("dCat").style.cssText =
      `color:${c.color};font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase`;
    document.getElementById("dTit").textContent = p.titulo;

    const fechaTxt = p.fecha
      ? `${DIAS[(parse(p.fecha).getDay()+6)%7] || ""} ${parse(p.fecha).getDate()} de ${MESES[parse(p.fecha).getMonth()]}`
      : "sin fecha";
    const rows = [
      ["Cuándo", `${fechaTxt}${p.hora ? `, ${esc(p.hora)}` : ""}`],
      ["Estado", (ESTADOS[p.estado] || {}).label || p.estado],
      p.imagen ? ["Imagen", esc(p.imagen)] : null,
      p.vence ? ["Fecha límite", `${p.vence} (${diasHasta(p.vence)} días)`] : null,
      p.metricas ? ["Métricas", Object.entries(p.metricas).map(([k,v]) => `${k}: ${v}`).join(" · ")] : null
    ].filter(Boolean);

    document.getElementById("dBody").innerHTML = `
      <div class="sect"><dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>
      ${p.nota ? `<div class="sect"><div class="note">${esc(p.nota)}</div></div>` : ""}
      ${p.texto ? bloque("Texto del post", p.texto, "t"+i) : ""}
      ${p.promptImagen ? bloque("Prompt de imagen", p.promptImagen, "p"+i, true) : ""}
      ${p.fuentes?.length ? `<div class="sect"><h4>Fuentes (van al primer comentario)</h4>
        <ul class="srcs">${p.fuentes.map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("")}</ul></div>` : ""}
    `;
    document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
      await navigator.clipboard.writeText(document.getElementById(b.dataset.for).textContent.trim());
      const t = b.textContent; b.textContent = "Copiado"; b.classList.add("ok");
      setTimeout(() => { b.textContent = t; b.classList.remove("ok"); }, 1400);
    });
    dlg.showModal();
  }
  const bloque = (titulo, txt, id, mono) => `<div class="sect">
      <h4>${titulo}<button class="copy" data-for="${id}">Copiar</button></h4>
      <pre class="txt${mono ? " mono" : ""}" id="${id}">${esc(txt)}</pre></div>`;

  document.getElementById("dClose").onclick = () => dlg.close();
  dlg.onclick = e => { if (e.target === dlg) dlg.close(); };

  // ---------- controles ----------
  const setVista = v => {
    vista = v;
    document.getElementById("vSemana").setAttribute("aria-pressed", String(v === "semana"));
    document.getElementById("vLista").setAttribute("aria-pressed", String(v === "lista"));
    render();
  };
  document.getElementById("vSemana").onclick = () => setVista("semana");
  document.getElementById("vLista").onclick  = () => setVista("lista");
  document.getElementById("prev").onclick = () => { semana = addDays(semana, -7); render(); };
  document.getElementById("next").onclick = () => { semana = addDays(semana,  7); render(); };
  document.getElementById("hoy").onclick  = () => { semana = monday(HOY); render(); };

  filtros();
  render();
})();
</script>
</body>
</html>
